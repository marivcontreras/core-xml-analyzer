
# Configuration for RDC2 (Primary Data Center)
routing_config: "resources/rdc2/routing.yaml"

devices:
  intranet_routers:
    - R1-DC
    - R2
    - R3
    - R4
    - R5
    - R6

  internet_routers:
    - ISP-Intranet
    - ISP-Casa

  other_routers:
    - R-Casa

networks:
  # defined by the name of the switch
  intranet_lan_networks:
    - SwDataCenter
    - WVentas
    - SwVentas
    - WGuest
    - SwAdmin
    - SwOfiAdmin

  # name of the routers combined
  intranet_p2p_networks:
    - R4<>R1-DC
    - R4<>R5
    - R5<>R6
    - R5<>R3
    - R4<>R3
    - R2<>R3
    - R2<>R4

  # name of the internet routers combined
  internet_networks:
    - ISP-Casa<>R-Casa
    - R2<>ISP-Intranet
    - ISP-Casa<>ISP-Intranet

  other_networks:
    - R-Casa<>PC-Casa