# Configuration for RDC1 (Secondary Data Center)
class_name: "rdc1"
routing_config: "resources/rdc1/routing.yaml"

subjects:
  - Networks
  - Routing
  - Firewall

devices:
  intranet_routers:
    - R2
    - R3
    - R4
    - R5
    - R6
  internet_routers:
    - ISP
  other_routers:
    - R1

networks:
  # defined by the name of the switch
  intranet_lan_networks:
    - name: Sw-Adm
      mask: 28
    - name: Sw-Troncal
      mask: 27
    - name: SW-DC
      mask: 24
    - name: SW-Comp
      mask: 29
    - name: SW-Esc
      mask: 27
    - name: wlan-Inv
      mask: 26
    - name: wlan-Reu
      mask: 28

  # name of the routers combined
  intranet_p2p_networks:
    - name: R5<>R6
      mask: 30

  # name of the internet routers combined
  internet_networks:
    - name: ISP<>R4
      mask: 24
    - name: ISP<>R2
      mask: 24
    - name: ISP<>R1
      mask: 24

  other_networks:
    - name: wlan-Casa
      mask: 24
