# RDC2 Routing Matrix Configuration
# 
# This file defines the expected routing configuration for RDC2 topology.
# Routes are separated into intranet and internet sections.
#
# Schema:
# intranet_routers/internet_routers:
#   Router:
#     NetworkDestination:
#       - type: (indirect|direct|policy)
#         vias: [list of "ROUTER-INTERFACE" entries]
#         dev: output interface (or "any" for flexible)
#         table: routing table name
#         prefix_types: [global, site] or [ipv4]
#         is_policy: true|false (only for policy routes)

intranet_routers:
R1-DC:
  SwDataCenter:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [global, site]

  WVentas:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  SwVentas:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  WGuest:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  SwAdmin:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [site]

  SwOfiAdmin:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [site]

  R4<>R1-DC:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [global, site]

  R4<>R5:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  R5<>R6:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  R5<>R3:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  R4<>R3:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  R2<>R3:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

  R2<>R4:
    - type: indirect
      vias: [R4-eth1]
      dev: eth1
      table: main
      prefix_types: [global, site]

R6:
  SwDataCenter:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  WVentas:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [global, site]

  SwVentas:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [global, site]

  WGuest:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  SwAdmin:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [site]

  SwOfiAdmin:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [site]

  R4<>R1-DC:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  R4<>R5:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  R5<>R6:
    - type: direct
      dev: eth2
      table: local
      prefix_types: [global, site]

  R5<>R3:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  R4<>R3:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  R2<>R3:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

  R2<>R4:
    - type: indirect
      vias: [R5-eth0]
      dev: eth2
      table: main
      prefix_types: [global, site]

R3:
  SwDataCenter:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  WVentas:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  SwVentas:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  WGuest:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  SwAdmin:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [site]

  SwOfiAdmin:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [site]

  R4<>R1-DC:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R4<>R5:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R5<>R6:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R5<>R3:
    - type: direct
      dev: eth2
      table: local
      prefix_types: [global, site]

  R4<>R3:
    - type: direct
      dev: eth4
      table: local
      prefix_types: [global, site]

  R2<>R3:
    - type: direct
      dev: eth3
      table: local
      prefix_types: [global, site]

  R2<>R4:
    - type: indirect
      vias: [R2-eth1, R4-eth3, R5-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

R5:
  SwDataCenter:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  WVentas:
    - type: indirect
      vias: [R6-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  SwVentas:
    - type: indirect
      vias: [R6-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  WGuest:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [global, site]

  SwAdmin:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [site]

  SwOfiAdmin:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [site]

  R1-DC<>R4:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R4<>R5:
    - type: direct
      dev: eth2
      table: local
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R5<>R6:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R5<>R3:
    - type: direct
      dev: eth3
      table: local
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R4<>R3:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R2<>R3:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

  R2<>R4:
    - type: indirect
      vias: [R4-eth0, R3-eth2]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: guest-isolation
      interface: eth3
      vias: [R3-eth2]
      prefix_types: [global, site]

R4:
  SwDataCenter:
    - type: indirect
      vias: [R1-DC-eth1]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  WVentas:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  SwVentas:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  WGuest:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  SwAdmin:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [site]

  SwOfiAdmin:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [site]

  R1-DC<>R4:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R4<>R5:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R5<>R6:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R5<>R3:
    - type: indirect
      vias: [R5-eth2, R3-eth4]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R4<>R3:
    - type: direct
      dev: eth3
      table: local
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R2<>R3:
    - type: indirect
      vias: [R5-eth2, R3-eth4, R2-eth0]
      dev: any
      table: main
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

  R2<>R4:
    - type: direct
      dev: eth2
      table: local
      prefix_types: [global, site]
    - type: policy
      table: to-r3
      interface: eth3
      vias: [R3-eth4]
      prefix_types: [global, site]

R2:
  SwDataCenter:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  WVentas:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  SwVentas:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  WGuest:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  SwAdmin:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [site]

  SwOfiAdmin:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [site]

  R1-DC<>R4:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R4<>R5:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R5<>R6:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R5<>R3:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R4<>R3:
    - type: indirect
      vias: [R4-eth2, R3-eth3]
      dev: any
      table: main
      prefix_types: [global, site]

  R2<>R3:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [global, site]

  R2<>R4:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [global, site]

internet_routers:
ISP-Intranet:
  ISP-Casa<>R-Casa:
    - type: indirect
      vias: [ISP-Casa-eth0]
      dev: eth1
      table: main
      prefix_types: [ipv4]

  R2<>ISP-Intranet:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [ipv4]

  ISP-Casa<>ISP-Intranet:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [ipv4]

ISP-Casa:
  R2<>ISP-Intranet:
    - type: indirect
      vias: [ISP-Intranet-eth1]
      dev: eth0
      table: main
      prefix_types: [ipv4]

  R-Casa<>ISP-Casa:
    - type: direct
      dev: eth1
      table: local
      prefix_types: [ipv4]

  ISP-Casa<>ISP-Intranet:
    - type: direct
      dev: eth0
      table: local
      prefix_types: [ipv4]
