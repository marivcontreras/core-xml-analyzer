# ============================================================================
# Centralized warning catalog
# ----------------------------------------------------------------------------
# Each entry maps a warning code to its message template and metadata:
#   message        : format template ({placeholders} filled at emit time)
#   type           : severity/kind (missing, invalid, design, inconsistent,
#                    syntax, error, warning, information)
#   scope          : object granularity the warning refers to
#                    (node, interface, link, network) - used for grouping
#   subject        : report section / course topic this warning belongs to
#                    (Networks, Sintaxis, RADVD, Routing, Tunneling, Policy,
#                     Firewall). A warning is only emitted when its subject is
#                    active for the current class (config subjects).
#   requires_ipv6  : (optional) when true, the warning is only emitted for
#                    classes with ipv6_support: true (e.g. rdc2).
#
# Subject coverage by class:
#   rdc1 -> Networks, Sintaxis, Routing, Firewall
#   rdc2 -> Networks, Sintaxis, RADVD, Routing, Tunneling, Policy
# ============================================================================

# ============================================================
# NETWORK VALIDATION WARNINGS
# ============================================================

missing_configured_router:
  message: "El router {node_name} no está presente en la sección de dispositivos de nivel 3"
  type: missing
  scope: node
  subject: Networks

missing_configured_network:
  message: "El nodo {net_name} no está presente en la sección de dispositivos de nivel 2"
  type: missing
  scope: network
  subject: Networks

duplicated_prefix:
  message: "{net_name}: el prefijo {prefix} ya fue asignado a la red {other_network}"
  type: invalid
  scope: network
  subject: Networks

ipv4_with_other_prefixes:
  message: "{net_name}: se asignaron direcciones adicionales en internet ({prefixes})"
  type: design
  scope: network
  subject: Networks

invalid_prefixes:
  message: "{net_name}: prefijo invalido ({prefixes})"
  type: design
  scope: network
  subject: Networks

too_many_prefixes:
  message: "{net_name}: se asignaron mas de {max_prefixes} bloque/s de red ({prefixes})"
  type: design
  scope: network
  subject: Networks

invalid_prefix_length:
  message: "{net_name}: prefijo {prefix} deberia ser /{expected}. Equipo que presenta conflictos {device}"
  type: invalid
  scope: network
  subject: Networks

invalid_last_octet:
  message: "{net_name}: prefijo {prefix} tiene el último octeto {actual} y debería ser {expected}"
  type: invalid
  scope: network
  subject: Networks

missing_site_prefix:
  message: "{net_name}: prefijo site faltante (existentes: {existing})"
  type: missing
  scope: network
  subject: Networks
  requires_ipv6: true

missing_global_prefix:
  message: "{net_name}: prefijo global faltante (existentes: {existing})"
  type: missing
  scope: network
  subject: Networks
  requires_ipv6: true

admin_with_global:
  message: "{net_name}: red admin no debería usar direcciones globales"
  type: design
  scope: network
  subject: Networks
  requires_ipv6: true

p2p_global_mismatch:
  message: "{net_name}: direcciones globales de distintos bloques ({global_a} - {global_b})"
  type: inconsistent
  scope: link
  subject: Networks
  requires_ipv6: true

p2p_site_mismatch:
  message: "{net_name}: direcciones site de distintos bloques ({site_a} - {site_b})"
  type: inconsistent
  scope: link
  subject: Networks
  requires_ipv6: true

p2p_missing_global:
  message: "{net_name}: {node_name} ({iface}) sin dirección global"
  type: inconsistent
  scope: link
  subject: Networks
  requires_ipv6: true

p2p_missing_site:
  message: "{net_name}: {node_name} ({iface}) sin dirección site"
  type: inconsistent
  scope: link
  subject: Networks
  requires_ipv6: true

p2p_ipv4_mismatch:
  message: "{net_name}: direcciones IPv4 de distintos bloques ({ipv4_a} - {ipv4_b})"
  type: inconsistent
  scope: link
  subject: Networks

p2p_missing_ipv4:
  message: "{net_name}: {node_name} ({iface}) sin dirección IPv4"
  type: inconsistent
  scope: link
  subject: Networks

# ============================================================
# NETWORK INFERENCE WARNINGS (analyzer/networks.py)
# ============================================================

missing_ip_interface:
  message: "{node_name} no tiene una dirección IP en {interface_name} (red {net_name})"
  type: missing
  scope: interface
  subject: Networks

missing_ip_p2p:
  message: "{node_name} no tiene una dirección IP en {interface_name} (p2p)"
  type: missing
  scope: interface
  subject: Networks

missing_ip_command:
  message: "{node_name}: Comandos ip addr faltantes"
  type: design
  scope: network
  subject: Networks

# ============================================================
# IP COMMANDS VALIDATION WARNINGS (command interpretation)
# ============================================================

invalid_ip_command:
