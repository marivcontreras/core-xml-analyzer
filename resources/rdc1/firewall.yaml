# RDC1 Firewall Configuration
#
# masquerade:
#   routers that must apply NAT (MASQUERADE) on the interface facing the ISP.
#   The expected command is:
#     iptables -t nat -A POSTROUTING -o <interface towards the ISP> -j MASQUERADE
#   The output interface is inferred from the topology (the router's link to
#   an internet router), so only the router names are listed here.
#
# filters:
#   expected commands per device (router or PC), compared against the
#   iptables commands found in its StaticRoute script.
#   Each command lists:
#     consigna : exercise of the assignment it belongs to (informative)
#     table    : iptables table (default: filter)
#     chain    : chain (FORWARD, INPUT, ...)
#     action   : target (-j): ACCEPT, REJECT, DROP, ...
#     options  : any of src (-s), dst (-d), iif (-i), oif (-o), protocol (-p).
#                Options that are not listed must NOT be present in the command.
#                Interface names, blocks and addresses depend on how each topology
#                was built (group number, wiring), so besides a literal value they
#                can be resolved from the topology:
#                  iif/oif : {network: X}            interface of the device in network X
#                  src/dst : {network: X}            block of network X
#                            {networks: [X, Y]}      smallest block containing those networks
#                            {host: H, network: X}   address of device H in network X
#     optional : same keys as options. These conditions may be absent, but if
#                present they must have the given value (redundant conditions
#                that are technically fine, e.g. -o on an ACCEPT to R1).
#     last     : (optional) true if the command must come after every other
#                expected command of its chain (e.g. a catch-all REJECT).
#                Without it the order between commands does not matter.
#
# options/optional also accept (for nat commands):
#     dport    : destination port (--dport)
#     to       : DNAT target (--to-destination), {host: H, network: X, port: P}:
#                address of device H in network X plus the port
#
# sections:
#   how the report groups the consignas, in order. Each section lists:
#     title     : heading of the section
#     consignas : letters of the consignas it covers (the `consigna` of the commands)
#     firewall  : devices whose expected commands (of those consignas) are shown
#     routing   : devices whose routes and routing warnings are shown
#   Commands found that belong to no section are listed under "Otros comandos".
#
# routes:
#   expected routes per router, compared against its `ip route add` commands
#   (main table, unicast). They are shown in the sections that list the router
#   under `routing`, filtered by the letter of their consigna. Each route lists:
#     consigna : exercise of the assignment it belongs to
#     dst      : "default", a literal, or {network: X} / {host: H, network: X}
#     via      : {host: H, network: X}   address of device H in network X (next hop)
#     dev      : {network: X}            interface of the router in network X
#   A found route is the expected one if it has the same destination; a route
#   that only overlaps it (e.g. the whole block instead of the host's IP) is
#   reported as having a wrong destination. Keys that are left out are not checked.

sections:
  - title: "C) Acceso a Internet solo para la Empresa 1 (firewall en R4, ruteo en R3)"
    consignas: [C]
    firewall: [R4]
    routing: [R3]
  - title: "D, E, F) Datacenter a Internet y tráfico hacia R1 por R2 (firewall en R2, ruteo en R3)"
    consignas: [D, E, F]
    firewall: [R2]
    routing: [R3]
  - title: "G) Wlan-Inv sin acceso a la PC de Administración (firewall en R6)"
    consignas: [G]
    firewall: [R6]
  - title: "H) SSH desde PC-Casa al ServerDocker (DNAT en R2)"
    consignas: [H]
    firewall: [R2]

masquerade:
  routers:
    - R2
    - R4
    - R1

filters:
  R2:
    # f) solo el centro de cómputo accede a la IP pública de R1
    - consigna: F [solo red computo -> R1]
      table: filter
      chain: FORWARD
      action: ACCEPT
      options:
        src: {network: Sw-Comp}
        dst: {host: R1, network: ISP<>R1}
      optional:
        oif: {network: ISP<>R2}
    # d) solo el datacenter sale a Internet por R2
    - consigna: D [solo red DC -> Internet]
      table: filter
      chain: FORWARD
      action: ACCEPT
      options:
        src: {network: Sw-Dc}
        oif: {network: ISP<>R2}
    - consigna: D [todo menos red DC -> Internet]
      table: filter
      chain: FORWARD
      action: REJECT
      last: true
      options:
        oif: {network: ISP<>R2}
    # h) el puerto 2222 de R2 se redirige al SSH (22) del ServerDocker
    - consigna: H [DNAT ssh -> ServerDocker]
      table: nat
      chain: PREROUTING
      action: DNAT
      options:
        protocol: tcp
        dport: 2222
        to: {host: ServerDocker, network: Sw-Dc, port: 22}
      optional:
        iif: {network: ISP<>R2}
        dst: {host: R2, network: ISP<>R2}

  R4:
    # c) solo la Empresa 1 sale a Internet por R4
    - consigna: C [solo Empresa 1 -> Internet]
      table: filter
      chain: FORWARD
      action: ACCEPT
      options:
        src: {networks: [Wlan-Inv, Sw-Esc, Wlan-Reu, Sw-Comp]}
        oif: {network: ISP<>R4}
    - consigna: C [todo menos Empresa 1 -> Internet]
      table: filter
      chain: FORWARD
      action: REJECT
      last: true
      options:
        oif: {network: ISP<>R4}

  R6:
    # g) wlan-Inv no accede a la PC de Administración
    - consigna: G [wlan-Inv -/-> PC Admin]
      table: filter
      chain: FORWARD
      action: REJECT
      options:
        iif: {network: wlan-Inv}
        src: {network: Wlan-Inv}
        dst: {host: Admin, network: Sw-Adm}

routes:
  R3:
    # c) la salida a Internet de la Empresa 1 es por R4
    - consigna: C [default -> R4]
      dst: default
      via: {host: R4, network: Sw-Adm}
      dev: {network: Sw-Adm}
    # e) el tráfico hacia la IP pública de R1 sale por R2
    - consigna: E [IP de R1 -> R2]
      dst: {host: R1, network: ISP<>R1}
      via: {host: R2, network: Sw-Dc}
      dev: {network: Sw-Dc}
