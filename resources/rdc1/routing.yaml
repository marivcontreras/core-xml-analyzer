# RDC1 Routing Matrix Configuration
#
# Placeholder for RDC1 routing configuration.
# To be populated when RDC1 topology is defined.
# 
# Schema:
# intranet_routers/internet_routers:
#   Router:
#     NetworkDestination:
#       - type: (indirect|direct|policy)
#         vias: [list of "ROUTER-INTERFACE" entries]
#         dev: output interface (or "any" for flexible)
#         table: routing table name
#         prefix_types: [global, site] or [ipv4]
#         is_policy: true|false (only for policy routes)

intranet_routers:
  R2:
    Sw-Adm:
      - type: indirect
        vias: [R3]
        table: main
        prefix_types: [ipv4]
      
